<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/avatar.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyDeusTools Web - Modern, privacy-first all-in-one utility suite running 100% in your browser." />
    <title>MyDeusTools Web - All-in-One Utility Suite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function () {
        var saved = localStorage.getItem('mydeustools_theme') || 'dark';
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.style.colorScheme = saved;
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200 selection:bg-indigo-500/30 selection:text-indigo-700 dark:selection:text-indigo-300">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
